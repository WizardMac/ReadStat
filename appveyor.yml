version: 0.1.{build}

os: Windows Server 2016

image: Visual Studio 2017

platform: x64

environment:
  matrix:
  - TOOLCHAIN: "msvc"

skip_tags: true

install:
  - git clone https://github.com/pffang/libiconv-for-Windows.git C:\projects\iconv
  - cd C:\projects\iconv
  - git checkout 0e36d95873
  # Mirror the GitHub Actions windows_msvc job: install libiconv and zlib
  # via vcpkg so "vcpkg integrate install" can inject the include/lib paths
  # (iconv.h, zlib.h) into MSBuild, just like the GH runner does.
  - ps: |
      $vcpkg = Get-Command vcpkg -ErrorAction SilentlyContinue
      if (-not $vcpkg) { $vcpkgExe = "C:\tools\vcpkg\vcpkg.exe" } else { $vcpkgExe = $vcpkg.Source }
      & $vcpkgExe install libiconv zlib --triplet x64-windows
      & $vcpkgExe integrate install
      $vcpkgRoot = Split-Path $vcpkgExe
      $libDir = Join-Path $vcpkgRoot "installed\x64-windows\lib"
      # vcpkg's libiconv installs as iconv.lib; the projects link against
      # libiconv.lib/libiconvD.lib
      if ((Test-Path "$libDir\iconv.lib") -and -not (Test-Path "$libDir\libiconv.lib")) {
        Copy-Item "$libDir\iconv.lib" "$libDir\libiconv.lib" -Force
      }
      if ((Test-Path "$libDir\iconvd.lib") -and -not (Test-Path "$libDir\libiconvD.lib")) {
        Copy-Item "$libDir\iconvd.lib" "$libDir\libiconvD.lib" -Force
      }
      # The zlib import library is named z.lib (or zlib1.lib) depending on
      # the port version; the projects link against zlib.lib/zlibd.lib
      if ((Test-Path "$libDir\z.lib") -and -not (Test-Path "$libDir\zlib.lib")) {
        Copy-Item "$libDir\z.lib" "$libDir\zlib.lib" -Force
      }
      if ((Test-Path "$libDir\zlib1.lib") -and -not (Test-Path "$libDir\zlib.lib")) {
        Copy-Item "$libDir\zlib1.lib" "$libDir\zlib.lib" -Force
      }
      if ((Test-Path "$libDir\zd.lib") -and -not (Test-Path "$libDir\zlibd.lib")) {
        Copy-Item "$libDir\zd.lib" "$libDir\zlibd.lib" -Force
      }
      if ((Test-Path "$libDir\zlib1d.lib") -and -not (Test-Path "$libDir\zlibd.lib")) {
        Copy-Item "$libDir\zlib1d.lib" "$libDir\zlibd.lib" -Force
      }

for:
-
  matrix:
    only:
      - TOOLCHAIN: "msvc"

  build:
    parallel: true
    project: VS17/ReadStat.sln
    verbosity: minimal

-
  matrix:
    except:
      - TOOLCHAIN: "msvc"

test_script:
  - ps: |
      if ($env:TOOLCHAIN -eq "msvc")
      {
        $state = "PASS"
        $tests = @("readstat","double_decimals","sav_date","dta_days")

        Copy-Item "C:\projects\iconv\lib64\libiconvD.dll" -Destination "C:\projects\readstat\VS17\x64\Debug\"
        # vcpkg's iconv.dll / zlib*.dll are also needed at run time
        $dllDirs = @("C:\vcpkg\installed\x64-windows\bin", "C:\tools\vcpkg\installed\x64-windows\bin")
        foreach ($dir in $dllDirs) {
          Get-ChildItem "$dir\iconv*.dll","$dir\charset*.dll","$dir\zlib*.dll","$dir\z.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "C:\projects\readstat\VS17\x64\Debug\" -Force
          }
        }

        for($i=0 ; $i -lt $tests.Length ; $i++)
        {
          $currTest = $tests[$i]
          $currExec = 'C:\projects\readstat\VS17\x64\Debug\ReadStat_Test_' + $currTest + '.exe;$?'

          echo "Running test $currTest..."
          $success = Invoke-Expression $currExec

          if(-not $success){
            $state = "FAIL"
            echo "Test result: FAIL"
          }
          else{
            echo "Test result: PASS"
          }
        }

        if($state -eq "FAIL")
        {
          exit 1
        }
      }
